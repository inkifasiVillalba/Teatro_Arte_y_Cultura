<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel del empleado</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina">
  <header>
    <h1 id="saludo"></h1>
    <button id="btn-salir">Cerrar sesión</button>
  </header>

  <h2>Validar entrada en la puerta</h2>
  <div class="pago">
    <input type="text" id="codigo" placeholder="Ej: TAC-2-1-5">
    <button id="btn-validar" class="btn-principal">Validar</button>
    <p id="resultado"></p>
  </div>

  <script src="js/empleado.js"></script>
</body>
</html>
