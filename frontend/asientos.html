<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asientos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina">
  <header>
    <h1>Elige tu función y tus asientos</h1>
    <button id="btn-volver">← Cartelera</button>
  </header>

  <h2>Horarios</h2>
  <div id="horarios"></div>

  <h2>Asientos</h2>
  <p class="escenario">★ ESCENARIO ★</p>
  <div id="mapa"></div>

  <p id="resumen">Asientos elegidos: ninguno</p>


  <div class="pago">
    <select id="metodo">
      <option value="TARJETA">Tarjeta</option>
      <option value="TRANSFERENCIA">Transferencia</option>
      <option value="EFECTIVO">Efectivo</option>
    </select>
    <button id="btn-comprar" class="btn-principal">Comprar</button>
    <button id="btn-reservar" class="btn-principal">Reservar (pagar en taquilla)</button>
    <p id="resultado"></p>
  </div>

    <!-- BOLETA Y COMPROBANTE -->
  <div id="modal-boleta" class="modal-overlay">
    <div class="modal-caja">
      <h2>🎟️ Boleta oficial y comprobante de pago</h2>
      <p>Teatro Arte y Cultura</p>
      <div id="boleta" class="boleta"></div>
      <div class="modal-botones">
        <button id="btn-imprimir">Imprimir comprobante</button>
        <button id="btn-cerrar-boleta">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="js/asientos.js"></script>
</body>
</html>
